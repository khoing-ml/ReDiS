[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "redis-diversity"
version = "0.1.0"
description = "Training-free diversity restoration experiments for distilled diffusion models"
requires-python = ">=3.10,<3.13"
dependencies = [
  "accelerate>=1.2",
  "diffusers @ git+https://github.com/huggingface/diffusers.git",
  "huggingface-hub>=0.30",
  "numpy>=1.26",
  "pillow>=10",
  "pyyaml>=6",
  "safetensors>=0.4",
  "torch==2.5.1",
  "transformers>=4.51",
]

[project.optional-dependencies]
quantization = ["bitsandbytes>=0.45"]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["redis"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
